name: build

on:
  push:
    branches: [master, 041095]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: restore packages
        run: nuget restore refx-updater.sln

      - name: build
        run: msbuild refx-updater.sln /p:Configuration=Release /p:Platform="Any CPU" /m /v:minimal

      - name: upload updater
        uses: actions/upload-artifact@v4
        with:
          name: refx-updater
          path: refx-updater/bin/Release/
